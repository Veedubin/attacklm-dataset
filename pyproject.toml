[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "attacklm-dataset"
version = "0.7.0"
description = "MITRE ATT&CK-grounded security fine-tuning dataset with per-record provenance"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Veedubin"}
]
keywords = ["mitre-attack", "cybersecurity", "llm", "fine-tuning", "dataset", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
attacklm-dataset = "attacklm_dataset.cli:main"

[project.optional-dependencies]
extract = [
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    "lxml>=5.0",
    "pyyaml>=6.0",
    "datasets>=2.14",
]
inversion = [
    "transformers>=4.40",
    "torch>=2.1",
    "nltk>=3.8",
    "llama-cpp-python>=0.2.60",
    "datasketch>=1.5,<2.0",
]